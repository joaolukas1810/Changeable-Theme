<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="João Lukas">
    <link rel="stylesheet" href="./css/light.css" id="theme">
    <title>Theme Change Test</title>
</head>

<body>
    <h1>Changeable Theme</h1>
    <h2>Dark Theme</h2>
    <button onclick="document.getElementById('theme').href ='./css/dark.css';">Dark Theme</button>
    <h2>Light Theme</h2>
    <button onclick="document.getElementById('theme').href ='./css/light.css';"> Light Theme</button>
</body>

</html>
